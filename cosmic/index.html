<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b26">
<title>Космическая таблица умножения</title>
<link rel="preload" href="/fonts/nunito-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(/fonts/nunito-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Nunito"; font-style: normal; font-weight: 400 900; font-display: swap; src: url(/fonts/nunito-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600 800; font-display: swap; src: url(/fonts/unbounded-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600 800; font-display: swap; src: url(/fonts/unbounded-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  color-scheme: dark;
  --bg: #0a0b26;
  --panel: rgba(24, 20, 66, .72);
  --panel-solid: #181442;
  --line: rgba(168, 150, 255, .22);
  --text: #f3f1ff;
  --muted: #b7b0dc;
  --blue: #7fd8ff;
  --mint: #5ff0c8;
  --mint-deep: #22c79b;
  --green: #83f0c0;
  --gold: #ffd76a;
  --pink: #ff8fd8;
  --violet: #8f74ff;
  --red: #ffadb8;
  --display: "Unbounded", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .9, .25, 1.2);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: var(--body);
  overflow-x: hidden;
}
.scene {
  background:
    radial-gradient(1200px 600px at 85% 110%, rgba(255, 120, 210, .22), transparent 60%),
    radial-gradient(900px 600px at 10% 100%, rgba(95, 240, 200, .12), transparent 60%),
    linear-gradient(180deg, #05061a 0%, #0d0f38 35%, #1f1660 70%, #3a1d78 100%);
}
button, input { font: inherit; }

/* ---------- Фоновая сцена ---------- */
.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
#sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.layer {
  position: absolute;
  transition: transform .9s cubic-bezier(.2, .7, .2, 1);
  will-change: transform;
}
.moon {
  top: 7vh; left: 6vw;
  width: clamp(110px, 14vw, 190px);
  aspect-ratio: 1;
}
.moon svg { width: 100%; height: 100%; overflow: visible; }
.moon::before {
  content: "";
  position: absolute;
  inset: -45%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 240, 255, .35), transparent 62%);
}
.ringed {
  top: 14vh; right: 9vw;
  width: clamp(70px, 8vw, 120px);
}
.island {
  width: clamp(200px, 24vw, 360px);
}
.island svg { width: 100%; height: auto; overflow: visible; display: block; }
.island-left { top: 34vh; left: -3vw; }
.island-right { top: 52vh; right: -4vw; width: clamp(180px, 21vw, 320px); }
.island-small { top: 20vh; right: 26vw; width: clamp(80px, 8vw, 120px); opacity: .85; }
.float { animation: float 7s ease-in-out infinite; }
.float.slow { animation-duration: 9s; animation-delay: -3s; }
.float.fast { animation-duration: 5s; animation-delay: -1s; }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-16px) rotate(.6deg); }
}
.gem {
  top: 46vh; right: 22vw;
  width: 34px;
  filter: drop-shadow(0 0 12px rgba(255, 215, 106, .9));
}
.gem svg { animation: spin 4s ease-in-out infinite; transform-origin: center; }
@keyframes spin {
  0%, 100% { transform: translateY(0) scaleX(1); }
  25% { transform: translateY(-8px) scaleX(.35); }
  50% { transform: translateY(-12px) scaleX(1); }
  75% { transform: translateY(-6px) scaleX(.35); }
}
.hills { left: 0; right: 0; bottom: 0; height: 32vh; min-height: 180px; }
.hills svg { width: 100%; height: 100%; display: block; }
.mist {
  left: -5%; right: -5%; bottom: -2vh; height: 20vh;
  animation: drift 26s ease-in-out infinite alternate;
}
.mist svg { width: 100%; height: 100%; display: block; }
@keyframes drift { from { transform: translateX(-2%); } to { transform: translateX(2%); } }
.glow-dot { animation: pulse 3s ease-in-out infinite; }
.glow-dot:nth-child(2n) { animation-delay: -1.4s; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

body.still .float, body.still .gem svg, body.still .mist,
body.still .glow-dot, body.still .rocket, body.still .flame,
body.still .orbit, body.still .twinkle, body.still .reveal {
  animation: none !important;
}

/* ---------- Каркас ---------- */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: auto;
  padding: 16px 20px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  padding: 8px 8px 8px 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(15px, 2.2vw, 19px);
  letter-spacing: .01em;
}
.brand svg { width: 36px; height: 36px; flex: none; }
.star-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 18px;
  border-radius: 999px;
  background: #fff;
  color: #1b1446;
  font-weight: 900;
  font-size: 16px;
  white-space: nowrap;
  box-shadow: 0 6px 24px rgba(255, 215, 106, .25);
}
.star-pill b { color: #f5a623; font-size: 18px; }
.star-pill.bump { animation: bump .5s var(--ease); }
@keyframes bump { 40% { transform: scale(1.18); } }

h2 {
  margin: 0 0 12px;
  font-family: var(--display);
  font-weight: 700;
  letter-spacing: -.01em;
  font-size: clamp(20px, 3vw, 28px);
  line-height: 1.15;
}
p { line-height: 1.55; }
small, .muted { color: var(--muted); }
.gold { color: var(--gold); }
.center { text-align: center; }

.panel {
  position: relative;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background:
    linear-gradient(160deg, rgba(143, 116, 255, .12), transparent 45%),
    var(--panel);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow:
    0 24px 60px -20px rgba(5, 3, 30, .8),
    inset 0 1px 0 rgba(255, 255, 255, .08);
}
.fresh .reveal { animation: reveal .6s var(--ease) both; }
.fresh .reveal:nth-child(2) { animation-delay: .08s; }
.fresh .reveal:nth-child(3) { animation-delay: .16s; }
.fresh .reveal:nth-child(4) { animation-delay: .24s; }
@keyframes reveal {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to { opacity: 1; transform: none; }
}

/* ---------- Кнопки ---------- */
button {
  min-height: 48px;
  padding: 12px 22px;
  border: 1px solid rgba(190, 175, 255, .28);
  border-radius: 999px;
  background: rgba(255, 255, 255, .06);
  color: var(--text);
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s var(--ease), background .2s, box-shadow .2s, border-color .2s;
}
button:hover:not(:disabled) {
  background: rgba(255, 255, 255, .12);
  border-color: rgba(200, 190, 255, .5);
  transform: translateY(-2px);
}
button:active:not(:disabled) { transform: translateY(1px) scale(.98); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
button:disabled { opacity: .4; cursor: default; }
button.primary {
  background: linear-gradient(180deg, #7ff7d6, var(--mint) 55%, #3fdcb2);
  border-color: transparent;
  color: #0b2a2a;
  box-shadow: 0 8px 26px -6px rgba(95, 240, 200, .65), inset 0 -3px 0 rgba(0, 0, 0, .12);
}
button.primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #9dffe3, #6ff5d0 55%, #4ae3ba);
  box-shadow: 0 12px 34px -6px rgba(95, 240, 200, .85), inset 0 -3px 0 rgba(0, 0, 0, .12);
}
button.light {
  background: #fff;
  color: #1b1446;
  border-color: transparent;
  box-shadow: 0 8px 26px -10px rgba(255, 255, 255, .5), inset 0 -3px 0 rgba(0, 0, 0, .08);
}
button.light:hover:not(:disabled) { background: #f1eeff; }
button.selected {
  border: 2px solid var(--gold);
  background: rgba(255, 215, 106, .12);
  box-shadow: 0 0 0 4px rgba(255, 215, 106, .12);
}

.stack {
  display: grid;
  gap: 12px;
  max-width: 470px;
  margin: 20px auto;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; }

/* ---------- Главный экран ---------- */
.hero-screen {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: 24px;
  min-height: min(62vh, 560px);
  padding: 10px 0 20px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid rgba(95, 240, 200, .35);
  background: rgba(95, 240, 200, .08);
  color: var(--mint);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.display {
  margin: 18px 0 16px;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 6vw, 64px);
  line-height: 1.02;
  letter-spacing: -.03em;
  text-shadow: 0 6px 40px rgba(143, 116, 255, .45);
}
.display .accent {
  background: linear-gradient(90deg, var(--mint), var(--blue) 45%, var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lead {
  max-width: 480px;
  margin: 0 0 26px;
  color: #d6d0f5;
  font-size: clamp(16px, 1.8vw, 18px);
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  max-width: 600px;
}
.controls button { min-height: 52px; padding: 12px 10px; font-size: 15px; white-space: nowrap; }
.controls button.main {
  grid-column: 1 / -1;
  min-height: 60px;
  font-size: 19px;
}
.hero-art {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  max-width: 420px;
  width: 100%;
  justify-self: center;
}
.hero-art .orbit {
  position: absolute;
  inset: 4%;
  border: 2px dashed rgba(170, 150, 255, .28);
  border-radius: 50%;
  animation: rotate 40s linear infinite;
}
.hero-art .orbit::after {
  content: "";
  position: absolute;
  top: 12%; left: 12%;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--pink);
  box-shadow: 0 0 18px var(--pink);
}
.hero-art .orbit.inner {
  inset: 20%;
  animation-duration: 26s;
  animation-direction: reverse;
  border-color: rgba(95, 240, 200, .25);
}
.hero-art .orbit.inner::after {
  top: auto; bottom: 8%; left: auto; right: 10%;
  width: 12px; height: 12px;
  background: var(--mint);
  box-shadow: 0 0 14px var(--mint);
}
@keyframes rotate { to { transform: rotate(360deg); } }
.rocket {
  position: relative;
  width: 46%;
  animation: hover 4s ease-in-out infinite;
  filter: drop-shadow(0 20px 40px rgba(95, 240, 200, .25));
}
.rocket svg { width: 100%; height: auto; display: block; overflow: visible; }
.flame { transform-origin: 50% 0; animation: flame .18s ease-in-out infinite alternate; }
@keyframes flame { to { transform: scaleY(1.25) scaleX(.9); } }
@keyframes hover {
  0%, 100% { transform: translateY(0) rotate(-6deg); }
  50% { transform: translateY(-18px) rotate(-3deg); }
}
.bubble {
  position: absolute;
  padding: 10px 16px;
  border-radius: 18px;
  background: #fff;
  color: #1b1446;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(14px, 1.6vw, 18px);
  box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .5);
  animation: float 6s ease-in-out infinite;
}
.bubble.b1 { top: 12%; right: 0; }
.bubble.b2 { bottom: 18%; left: -2%; animation-delay: -2s; background: var(--gold); }
.bubble.b3 { bottom: 4%; right: 12%; animation-delay: -4s; background: var(--mint); color: #0b2a2a; }

.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 10px 0 8px;
}
.feature { padding: 22px; }
.feature .icon {
  display: grid;
  place-items: center;
  width: 52px; height: 52px;
  margin-bottom: 14px;
  border-radius: 16px;
  font-size: 26px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid var(--line);
}
.feature h3 {
  margin: 0 0 6px;
  font-family: var(--display);
  font-size: 17px;
  font-weight: 700;
}
.feature p { margin: 0; color: var(--muted); font-size: 15px; }

/* ---------- Уровни ---------- */
.screen-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 22px 0;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
  transition: transform .3s var(--ease), border-color .3s;
}
.card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.card p { flex: 1; margin: 0 0 10px; }
.card h2 { color: var(--c); margin: 0; font-size: 22px; }
.card strong { font-size: 17px; }
.card.locked { filter: saturate(.3); }
.planet {
  position: relative;
  width: 86px; height: 86px;
  margin: 4px 0 8px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, #fff8 0 8%, transparent 30%),
    radial-gradient(circle at 35% 35%, var(--c), color-mix(in srgb, var(--c) 40%, #120c35) 75%);
  box-shadow: 0 0 40px -4px var(--c), inset -12px -14px 0 rgba(0, 0, 0, .25);
}
.planet.ring::after {
  content: "";
  position: absolute;
  left: -22px; right: -22px; top: 38%;
  height: 22px;
  border: 4px solid color-mix(in srgb, var(--c) 70%, #fff);
  border-radius: 50%;
  transform: rotate(-16deg);
  opacity: .8;
}
.card-glow {
  position: absolute;
  top: -60px; right: -60px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%);
  pointer-events: none;
}
.tag {
  display: inline-block;
  align-self: flex-start;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .08);
  font-size: 13px;
  font-weight: 800;
  color: var(--muted);
}

/* ---------- Игра ---------- */
.game {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 16px;
  align-items: start;
}
.stage { padding: 0 !important; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; }
#field { border-top: 1px solid var(--line); }
.stats {
  padding: 14px 18px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.5;
}
.assistant {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 4px 14px;
  margin-top: 14px;
  align-items: start;
}
.assistant .bot {
  grid-row: span 3;
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 16px;
  background: linear-gradient(160deg, var(--mint), var(--blue));
  font-size: 24px;
  box-shadow: 0 6px 20px -6px rgba(95, 240, 200, .7);
}
.assistant strong { font-family: var(--display); font-size: 14px; letter-spacing: .02em; }
.assistant p { margin: 4px 0 0; font-weight: 700; }
#hint { color: var(--gold); }
#hint:empty { display: none; }
#question { font-family: var(--display); font-weight: 700; font-size: 18px; }
.answer {
  display: grid;
  place-items: center;
  min-height: 76px;
  margin: 12px 0 16px;
  border: 2px solid rgba(127, 216, 255, .55);
  border-radius: 20px;
  background: rgba(5, 6, 26, .65);
  box-shadow: inset 0 0 30px rgba(127, 216, 255, .15), 0 0 24px -8px rgba(127, 216, 255, .6);
  font-family: var(--display);
  font-size: 40px;
  font-weight: 800;
}
.keys {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.keys button {
  min-height: 60px;
  padding: 8px;
  border-radius: 18px;
  font-size: 25px;
  font-weight: 900;
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25);
}
.keys button.primary { font-size: 20px; }
.tools { display: grid; gap: 10px; margin-top: 14px; }
.volume {
  display: grid;
  grid-template-columns: 1fr 60px;
  text-align: left;
  gap: 10px;
  font-weight: 800;
}
.volume input { width: 100%; grid-column: 1 / -1; accent-color: var(--mint); }
.hero { font-size: 76px; margin: 10px; filter: drop-shadow(0 0 24px rgba(255, 215, 106, .6)); }
.twinkle { display: inline-block; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.12) rotate(12deg); } }
#notice { color: var(--gold); font-size: 14px; }
#notice:empty { display: none; }
footer {
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .03em;
}

@media (max-width: 860px) {
  .hero-screen { grid-template-columns: 1fr; text-align: center; min-height: 0; }
  .hero-screen .lead { margin-inline: auto; }
  .controls { margin-inline: auto; }
  .hero-art { max-width: 300px; order: -1; }
  .features { grid-template-columns: 1fr; }
  .island-left, .island-right { opacity: .55; }
}
@media (max-width: 720px) {
  .controls { grid-template-columns: 1fr; max-width: 360px; }
  .wrap { padding: 10px 12px; }
  header { margin-bottom: 8px; padding: 4px; }
  .brand span { font-size: 14px; }
  .panel { padding: 16px; border-radius: 22px; }
  .cards { grid-template-columns: 1fr; }
  .game { grid-template-columns: 1fr; gap: 10px; }
  .stats { font-size: 13px; padding: 8px 12px; }
  .assistant { margin-top: 10px; grid-template-columns: 38px 1fr; }
  .assistant .bot { width: 38px; height: 38px; font-size: 19px; border-radius: 12px; }
  .assistant p { font-size: 14px; }
  .answer { min-height: 54px; margin: 8px 0; font-size: 32px; }
  .keys button { min-height: 50px; }
  .tools { grid-template-columns: 1fr 1fr; margin-top: 10px; }
  .island-small, .ringed { display: none; }
  .panel { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(24, 20, 66, .9); }
  .hills { height: 22vh; }
}
@media (max-height: 500px) and (min-width: 600px) {
  .game { grid-template-columns: minmax(0, 1fr) 240px; }
  .keys button { min-height: 40px; padding: 6px; }
  .answer { min-height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<!-- Декоративная сцена: звёзды, луна, парящие острова и туманность -->
<div class="scene" aria-hidden="true">
  <canvas id="sky"></canvas>

  <div class="layer moon" data-depth="8">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="moonG" cx="38%" cy="35%" r="70%">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".6" stop-color="#d9f3ff"/>
          <stop offset="1" stop-color="#9fd2f0"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#moonG)"/>

<script>
"use strict";

const LEVELS = {
  1: {
    tables: [2, 3, 4],
    name: "Лунный маршрут",
    boss: "Ледяной гигант",
    color: "#73d7ff"
  },
  2: {
    tables: [5, 6, 7],
    name: "Кольца туманности",
    boss: "Каменный страж",
    color: "#d6a4ff"
  },
  3: {
    tables: [8, 9],
    name: "Кристальная галактика",
    boss: "Кристаллическое ядро",
    color: "#ff9bc3"
  }
};
const COLORS = ["#60c2ff", "#78f0cd", "#ffca64", "#ca97ff"];
function rocketSVG(color) {
  return `<svg viewBox="0 0 120 200">
    <g class="flame">
      <path d="M44 150 Q60 205 76 150 Z" fill="#ffd76a"/>
      <path d="M51 150 Q60 185 69 150 Z" fill="#fff4c2"/>
    </g>
    <path d="M30 118 L10 150 L36 146 Z" fill="#ff8fd8"/>
    <path d="M90 118 L110 150 L84 146 Z" fill="#ff8fd8"/>
    <path d="M60 6 C92 30 96 90 86 150 L34 150 C24 90 28 30 60 6 Z" fill="${color}"/>
    <path d="M60 6 C80 22 88 60 86 110 C70 70 66 40 60 6 Z" fill="#ffffff" opacity=".25"/>
    <circle cx="60" cy="70" r="17" fill="#ffffff"/>
    <circle cx="60" cy="70" r="12" fill="#1b1446"/>
    <circle cx="55" cy="65" r="4" fill="#7fd8ff"/>
    <rect x="40" y="132" width="40" height="8" rx="4" fill="#1b1446" opacity=".25"/>
    <path d="M60 136 L60 160" stroke="#ff8fd8" stroke-width="8" stroke-linecap="round"/>
  </svg>`;
}
const SHIPS = [
  "Синий исследователь", "Ледяной путешественник",
  "Золотой защитник", "Звёздный странник"
];
const KEY = "cosmic-browser-v2";
const $ = id => document.getElementById(id);
const int = (v, a, b) => Number.isInteger(v) && v >= a && v <= b;
const obj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const validKey = k => typeof k === "string" && /^[2-9]:(?:[1-9]|10)$/.test(k);
const MAX = Number.MAX_SAFE_INTEGER;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function defaults() {
  return {
    version: 2,
    stars: 0, completed: [], ship: 0, mode: "learn",
    settings: {
      music: 25, sound: 60, particles: true,
      flashes: false, shake: false, motion: !reducedMotion
    },
    practice: {
      tick: 0, lastReview: -100, recent: [], decks: {}, stats: {}
    },
    mission: null
  };
}

function validMission(m) {
  if (!obj(m) || !int(m.level, 1, 3)) return false;
  if (!["learn", "challenge"].includes(m.mode)) return false;
  if (!int(m.normal, 0, 15) || !int(m.bosses, 0, 2)) return false;
  if (!int(m.shield, 0, 3) || !int(m.left, 0, m.level + 2)) return false;
  if (!int(m.mistakes, 0, MAX) || !int(m.earned, 0, 30)) return false;
  if (!int(m.seed, 0, 999999)) return false;
  if (!Number.isFinite(m.x) || m.x < 160 || m.x > 700) return false;
  if (!validKey(m.question)) return false;
  if (!LEVELS[m.level].tables.includes(Number(m.question.split(":")[0])))
    return false;
  if (["boss", "helped", "hint"].some(k => typeof m[k] !== "boolean"))
    return false;

  const boss = m.normal > 0 && m.normal % 5 === 0 &&
    m.bosses < m.normal / 5;
  const completedBosses = Math.floor((m.normal - (boss ? 1 : 0)) / 5);

  return m.boss === boss &&
    m.bosses === completedBosses &&
    (boss ? m.left >= 1 : m.left === 0) &&
    m.earned === m.normal + m.bosses * 5;
}

let notice = "";

function load() {
  const d = defaults();
  try {
    const rawText = localStorage.getItem(KEY);
    if (!rawText) return d;
    const r = JSON.parse(rawText);
    if (!obj(r) || r.version !== 2) throw Error("Формат сохранения");

    if (int(r.stars, 0, MAX)) d.stars = r.stars;
    if (Array.isArray(r.completed))
      d.completed = [...new Set(r.completed.filter(n => int(n, 1, 3)))];
    if (int(r.ship, 0, 3) &&
        (r.ship === 0 || d.completed.includes(r.ship)))
      d.ship = r.ship;
    if (["learn", "challenge"].includes(r.mode)) d.mode = r.mode;

    if (obj(r.settings)) {
      for (const k of ["music", "sound"])
        if (int(r.settings[k], 0, 100)) d.settings[k] = r.settings[k];
      for (const k of ["particles", "flashes", "shake", "motion"])
        if (typeof r.settings[k] === "boolean")
          d.settings[k] = r.settings[k];
    }

    const p = r.practice;
    if (obj(p) && int(p.tick, 0, MAX) && int(p.lastReview, -100, p.tick)) {
      d.practice.tick = p.tick;
      d.practice.lastReview = p.lastReview;
      if (Array.isArray(p.recent))
        d.practice.recent = p.recent.filter(validKey).slice(-8);
      if (obj(p.decks)) {
        for (const level of [1, 2, 3]) {
          if (Array.isArray(p.decks[level]))
            d.practice.decks[level] = [...new Set(p.decks[level].filter(
              k => validKey(k) &&
                LEVELS[level].tables.includes(Number(k.split(":")[0]))
            ))];
        }
      }
      if (obj(p.stats)) {
        for (const [k, s] of Object.entries(p.stats)) {
          if (validKey(k) && obj(s) &&
              int(s.errors, 0, MAX) && int(s.weight, 0, 6) &&
              int(s.streak, 0, 2) && int(s.due, 0, MAX))
            d.practice.stats[k] = s;
        }
      }
    }
    if (validMission(r.mission)) d.mission = r.mission;
    else if (r.mission != null)
      notice = "Повреждённая миссия пропущена. Можно начать новую.";
  } catch {
    notice = "Сохранение не прочитано. Можно играть с новым прогрессом.";
  }
  return d;
}

const data = load();
let screen = "menu", settingsBack = "menu";
let answer = "", message = "Введи ответ и нажми OK!";
let messageColor = "#eef4ff";
let freeze = 1, transition = 0, shake = 0;
let time = 0, saveElapsed = 0, hitX = 700;
let particles = [], finished = null, ctx = null;
let audio = null, musicElapsed = 0, musicIndex = 0;
const musicNotes = [261.63,329.63,392,329.63,293.66,349.23,440,349.23];

function unlocked() {
  return Math.min(3, Math.max(1, ...data.completed.map(n => n + 1)));
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch {
    notice = "Сохранение недоступно: прогресс может потеряться после закрытия.";
  }
  $("notice").textContent = notice;
}

// Звук активируется после нажатия пользователя.
function unlockAudio() {
  try {
    const Constructor = window.AudioContext || window.webkitAudioContext;
    if (!Constructor) return;
    if (!audio) audio = new Constructor();
    if (audio.state === "suspended") audio.resume().catch(() => {});
  } catch {}
}
function tone(frequency, delay, duration, volume, type = "sine") {
  if (!audio || audio.state !== "running" || volume <= 0) return;
  try {
    const t = audio.currentTime + delay;
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume, t + .02);
    gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.onended = () => {
      oscillator.disconnect();
      gain.disconnect();
    };
    oscillator.start(t);
    oscillator.stop(t + duration + .01);
  } catch {}
}
function sound(name) {
  const notes = {
    correct: [523.25, 783.99],
    wrong: [246.94, 220],
    hit: [130.81, 98],
    boss: [392, 523.25, 783.99]
  }[name];
  notes.forEach((f, i) => tone(f, i * .11, .16, data.settings.sound / 700));
}

// Очередь заданий и повторение трудных примеров.
function entry(k) {
  return data.practice.stats[k] ||= {errors: 0, weight: 0, streak: 0, due: 0};
}
function dueLater() {
  return data.practice.tick + 4 + Math.floor(Math.random() * 3);
}
function difficult(k, error = true) {
  const s = entry(k);
  if (error) s.errors++;
  s.weight = Math.min(6, s.weight + 1);
  s.streak = 0;
  s.due = dueLater();
}
function solved(k, independent) {
  const s = entry(k);
  if (!s.weight) return;
  s.streak = independent ? s.streak + 1 : 0;
  if (s.streak >= 2) {
    s.weight = 0;
    s.due = 0;
  } else s.due = dueLater();
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nextQuestion(level) {
  const p = data.practice;
  p.tick++;
  const pool = LEVELS[level].tables.flatMap(a =>
    Array.from({length: 10}, (_, i) => `${a}:${i + 1}`)
  );
  let deck = p.decks[level];
  if (!deck || !deck.length) deck = p.decks[level] = shuffle([...pool]);

  const recent = new Set(p.recent.slice(-3));
  const due = p.tick - p.lastReview >= 3 ? pool.filter(k => {
    const s = entry(k);
    return s.weight > 0 && s.due <= p.tick && !recent.has(k);
  }) : [];

  let selected;
  if (due.length) {
    let r = Math.random() * due.reduce((sum, k) => sum + entry(k).weight, 0);
    selected = due[due.length - 1];
    for (const k of due) {
      r -= entry(k).weight;
      if (r < 0) { selected = k; break; }
    }
    p.lastReview = p.tick;
  } else {
    selected = deck.find(k => !recent.has(k)) ||
      deck.find(k => k !== p.recent[p.recent.length - 1]) || deck[0];
  }

  const index = deck.indexOf(selected);
  if (index >= 0) deck.splice(index, 1);
  p.recent.push(selected);
  p.recent = p.recent.slice(-8);
  return selected;
}

// Миссии.
function spawn() {
  const m = data.mission;
  const wasBoss = m.boss;
  m.boss = m.normal > 0 && m.normal % 5 === 0 &&
    m.bosses < m.normal / 5;
  if (m.boss && m.left <= 0) m.left = m.level + 2;
  if (!m.boss || !wasBoss) m.seed = Math.floor(Math.random() * 1000000);
  m.question = nextQuestion(m.level);
  m.x = 700;
  m.mistakes = 0;
  m.helped = m.hint = false;
  answer = "";
}
function start(level) {
  if (!int(level, 1, unlocked())) return;
  if (data.mission &&
      !confirm("Заменить незавершённую миссию? Собранные звёзды сохранятся."))
    return;

  data.mission = {
    level, mode: data.mode, normal: 0, bosses: 0,
    boss: false, left: 0, shield: 3, question: "",
    x: 700, seed: 0, mistakes: 0, helped: false,
    hint: false, earned: 0
  };
  particles = [];
  transition = shake = 0;
  freeze = 1;
  message = "Введи ответ и нажми OK — корабль выстрелит!";
  messageColor = "#eef4ff";
  spawn();
  go("play");
  save();
}
function resume() {
  const m = data.mission;
  if (!m) return;
  go(m.mode === "challenge" && m.shield <= 0 ? "failed" : "play");
}
function hintText() {
  const [a,b] = data.mission.question.split(":").map(Number);
  if (a <= 5)
    return `${a} × ${b} = ${Array(a).fill(b).join(" + ")} = ${a*b}`;
  return `5 × ${b} = ${5*b}. Ещё ${a-5} × ${b} = ${(a-5)*b}.
    Вместе: ${5*b} + ${(a-5)*b} = ${a*b}.`;
}
function hint() {
  if (screen !== "play" || transition > 0) return;
  const m = data.mission;
  if (!m.helped) difficult(m.question, false);
  m.helped = m.hint = true;
  freeze = Math.max(freeze, 6);
  message = "Посмотрим на пример по частям.";
  messageColor = "#80caff";
  sync();
  save();
}
function digit(n) {
  if (screen !== "play" || transition > 0 || answer.length >= 3) return;
  answer += n;
  sync();
}
function erase() {
  if (screen !== "play" || transition > 0) return;
  answer = answer.slice(0, -1);
  sync();
}
function reward(n) {
  data.stars += n;
  data.mission.earned += n;
}
function burst(x, boss) {
  if (data.settings.shake) shake = .2;
  if (!data.settings.particles) return;
  for (let i = 0; i < (boss ? 38 : 22); i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 170;
    particles.push({
      x, y: 180,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: .4 + Math.random() * .5,
      color: boss ? LEVELS[data.mission.level].color : "#ffda82"
    });
  }
}
function submit() {
  if (screen !== "play" || !answer || transition > 0) return;
  const m = data.mission;
  const [a,b] = m.question.split(":").map(Number);

  if (Number(answer) !== a*b) {
    m.mistakes++;
    difficult(m.question);
    answer = "";
    freeze = Math.max(freeze, 2.5);
    message = "Попробуем ещё! Ошибка не отнимает щит.";
    messageColor = "#ffaaaa";
    if (m.mistakes >= 2) {
      m.helped = m.hint = true;
      freeze = Math.max(freeze, 6);
    }
    sound("wrong");
    sync();
    save();
    return;
  }

  solved(m.question, m.mistakes === 0 && !m.helped);
  message = `Верно! ${a} × ${b} = ${a*b}. Отличная работа!`;
  messageColor = "#83edb7";
  hitX = m.x;
  burst(hitX, m.boss);
  let defeated = false;

  if (m.boss) {
    m.left--;
    if (m.left === 0) {
      m.bosses++;
      reward(5);
      defeated = true;
      message = "Босс побеждён! Ты получаешь 5 звёзд!";
    }
  } else {
    m.normal++;
    reward(1);
  }
  sound(defeated ? "boss" : "correct");

  if (m.bosses === 3) {
    const first = !data.completed.includes(m.level);
    if (first) {
      data.completed.push(m.level);
      data.ship = m.level;
    }
    finished = {level: m.level, earned: m.earned, first};
    data.mission = null;
    answer = "";
    transition = 0;
    go("victory");
  } else {
    spawn();
    transition = .65;
    freeze = Math.max(freeze, .65);
    sync();
  }
  save();
}
function collision() {
  const m = data.mission;
  m.shield--;
  m.x = 700;
  freeze = 1.5;
  message = "Астероид задел щит. Попробуем остановить его!";
  messageColor = "#ffda82";
  if (data.settings.shake) shake = .25;
  sound("hit");
  if (m.shield <= 0) go("failed");
  else sync();
  save();
}
